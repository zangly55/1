name: Cvalarm portable checks
on:
  push:
    paths:
      - 'projects/cvalarm/**'
      - '.github/workflows/cvalarm-tests.yml'
  pull_request:
    paths:
      - 'projects/cvalarm/**'
      - '.github/workflows/cvalarm-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: projects/cvalarm
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel . --no-deps -w dist
      - run: python tools/check_wheel.py dist/cvalarm-1.1.0-py3-none-any.whl
      - run: python tools/check_relocation.py
